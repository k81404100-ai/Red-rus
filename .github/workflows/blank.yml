name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export APK
        uses: dulvui/godot-android-export@v4
        with:
          godot-version: 4.4.1  # укажите свою версию Godot
          working-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./build/*.apk
